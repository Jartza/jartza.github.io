    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagsu — 16x2 characters free</title>
    <meta name="description" content="Tagsu is a programmable, wearable electronic nametag with a 16x2 character LCD. Do the tagsu man!" />

    <meta property="og:title" content="tagsu.io" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tagsu.io/" />
    <meta property="og:image" content="https://tagsu.io/img/bg.png" />

    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div id="tape"></div>

    <header class="masthead">
      <img src="img/tagsu_logo_v2.png" alt="Tagsu" />

        <a id="facebook-share" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Ftagsu.io">Share</a>

    <p class="tagline">16 &times; 2 characters free</p>

    <div class="console" id="console">

      <div class="prompt">&gt;&nbsp;<span class="typed"></span><span class="cursor">&#x2588;</span></div>
      <input type="text" class="offscreen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Console input" />

    <div class="callouts">
      <a href="edit.html">

      <a href="mailto:tagsu@rakettitiede.com?subject=Tagsu">

      </a>
      <a href="https://www.facebook.com/TagsuTag" target="_blank" rel="noopener">
        <strong>Facebook</strong>
        Follow Tagsu
      </a>
      <a href="https://youtu.be/3ZH9MMPjONw" target="_blank" rel="noopener">

    <script type="module">
      import { startConsole } from './js/console.js';
      startConsole(document.getElementById('console'));
    </script>
